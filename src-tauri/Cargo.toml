[package]
name = "llm-wiki"
version = "0.6.8"
description = "LLM Wiki - A personal knowledge base for LLM concepts"
authors = []
edition = "2021"
# AnyDoc and its archive/spreadsheet dependencies require Rust 1.88. Declaring
# the floor here gives contributors an immediate toolchain error instead of a
# late, platform-dependent dependency compilation failure.
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "llm_wiki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "llm-wiki"
path = "src/main.rs"

[features]
# Default build: full desktop app with the Tauri webview (wry), tray icon and
# native dialogs. Behavior is unchanged from before this feature split.
default = ["desktop"]
desktop = [
    "tauri/wry",
    "tauri/tray-icon",
    "tauri/compression",
    "tauri/dynamic-acl",
    "tauri/x11",
    "tauri/dbus",
    "tauri/common-controls-v6",
    "dep:tauri-plugin-dialog",
]
# Headless build: drops wry (and therefore webkit2gtk / Webview2) and the
# dialog plugin (rfd -> gtk on Linux) so the binary links neither GTK nor
# WebKit. Uses tauri's MockRuntime to drive the app without a window, so the
# `serve` subcommand runs on stock servers (Rocky/RHEL 9, containers) with
# only glibc + openssl. Build with:
#   cargo build --release --no-default-features --features headless
# `protocol-asset` stays in the base tauri declaration below because
# tauri-build statically checks it against tauri.conf.json's assetProtocol.
headless = ["tauri/test"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `default-features = false` so the `headless` feature can opt out of wry.
# The `desktop` feature re-adds wry + tray-icon. `protocol-asset` is required
# by tauri-build (matches tauri.conf.json assetProtocol) and links no GUI
# libs, so it lives in the base declaration for both builds.
tauri = { version = "2", default-features = false, features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
# rfd links gtk-sys/glib-sys on Linux, so the dialog plugin is optional and
# only pulled in by the `desktop` feature. Browser/serve mode never uses
# native dialogs (the frontend shim returns cancelled), so headless builds
# omit it entirely to stay GTK-free.
tauri-plugin-dialog = { version = "2.7.1", optional = true }
pdfium-render = "0.9"
tauri-plugin-store = "2.4.2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tiny_http = "0.12"
# Browser-mode UI server (serve subcommand): axum hosts the API, SSE event
# streams, static frontend assets and the /cmd invoke bridge. Runs on the
# Tokio runtime Tauri already provides.
axum = { version = "0.8", features = ["macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
mime_guess = "2"
# `open` launches the user's default browser at the served UI URL.
open = "5"
zip = "2"
calamine = "0.34.0"
docx-rs = "0.4.20"
office_oxide = "=0.1.2"
anydoc = "0.1.6"
lancedb = "0.27.2"
# tokio provided by tauri runtime for async commands
arrow-array = "57"
arrow-schema = "57"
futures = "0.3"
# Claude Code CLI subprocess transport: spawn `claude` as a child process,
# stream stdout line-by-line back to the frontend. tokio::process gives us
# async io and clean cancellation; `which` locates the binary on PATH.
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt", "net", "time", "fs", "signal"] }
which = "7"
uuid = { version = "1", features = ["v4"] }
# Multimodal image extraction (Phase 1):
#   `image` re-encodes pdfium's raw bitmap output to PNG so the IPC
#   payload is self-contained (the frontend doesn't need to know
#   about pdfium's internal RGBA layout).
#   `base64` serializes binary image data for Tauri IPC, which is
#   JSON-only — Vec<u8> roundtrips ~1.33× larger than raw bytes but
#   that's acceptable for our ~MB-scale per-image payloads.
#   `sha2` is for the dedup cache (Phase 3) — same image hash =
#   same caption, no redundant VLM calls. Pulled in here so the
#   extraction layer can also expose the hash if a caller wants it.
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
sha2 = "0.10"
md-5 = "0.10"
notify = "8"
walkdir = "2"
epub = "2.1.5"
mobi = "0.8"
html2text = { version = "0.17.1", default-features = false, features = ["xml"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Unwind (not abort) so third-party parser panics can be caught at the
# Tauri command boundary via panic_guard and turned into errors. Slightly
# larger binary, but prevents single-file corruption from killing the app.
panic = "unwind"
strip = true

