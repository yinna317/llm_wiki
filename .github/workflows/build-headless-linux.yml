# Builds the headless (GTK/WebKit-free) Linux binary in the cloud so neither
# the dev machine nor the server needs a Rust toolchain. The build runs inside
# an AlmaLinux 9 container because Rocky/RHEL 9 ships glibc 2.34 — a binary
# built on a newer-glibc distro (e.g. the ubuntu-latest host itself) would
# refuse to start on Rocky 9.
#
# Trigger: "Actions" tab -> "build-headless-linux" -> "Run workflow", or any
# push to feat/headless-serve. The result is published two ways:
#   1. A workflow artifact (visible on the run page).
#   2. A rolling prerelease tagged `headless-latest`, so the server can pull
#      the package directly:
#        curl -LO https://github.com/nashsu/llm_wiki/releases/download/headless-latest/llm-wiki-linux-x86_64.tar.gz
#      (If the repo is private, add: -H "Authorization: Bearer <github-token>")

name: build-headless-linux

on:
  workflow_dispatch:
  push:
    branches: [feat/headless-serve]

permissions:
  contents: write # required to publish the rolling release

jobs:
  build:
    runs-on: ubuntu-latest
    container: almalinux:9
    timeout-minutes: 120
    env:
      # Shadow/stub .pc files prepared by the deps step (see its comment).
      PKG_CONFIG_PATH: /opt/pc-shadow
    steps:
      # actions/checkout and the other JS actions need node and git inside the
      # container, so the toolchain install must come first. Kept as separate
      # steps so a failure points at the exact command; dnf metadata/mirror
      # hiccups are retried.
      - name: Refresh dnf metadata
        run: |
          set -euxo pipefail
          for i in 1 2 3; do dnf makecache && break || sleep 15; done

      - name: Install compilers and native deps
        run: |
          set -euxo pipefail
          for i in 1 2 3; do
            dnf groupinstall -y "Development Tools" && \
            dnf install -y git curl dnf-plugins-core protobuf-compiler openssl-devel cmake && break || sleep 15
          done
          dnf clean all

      # tauri 2.x (core + tauri-runtime) declares gtk and webkit2gtk as
      # NON-optional Linux dependencies, so even the wry-free headless build
      # must satisfy their pkg-config probes:
      #   * gtk3/glib: real EL9 packages work, but gtk-rs 0.18 demands
      #     glib >= 2.70 (soup3 -> gio v2_70) while EL9 pins glib 2.68.4 —
      #     shadow the glib-family .pc files with only the Version bumped.
      #   * webkit2gtk-4.1 / javascriptcoregtk-4.1 / libsoup-3.0: not shipped
      #     by EL9 at all (4.1 ABI is Fedora 40+/RHEL 10) — provide minimal
      #     .pc files and empty stub shared objects.
      # None of these libraries is ever called on the MockRuntime path, and
      # rustc links with --as-needed, so unreferenced libs drop out of
      # DT_NEEDED; the linkage check below fails the build if any WebKit
      # stub survives into the shipped binary.
      - name: Install/shim GTK/WebKit build-time deps
        run: |
          set -euxo pipefail
          dnf config-manager --set-enabled crb
          dnf install -y gtk3-devel glib2-devel

          shadow=/opt/pc-shadow
          mkdir -p "$shadow"
          for pc in /usr/lib64/pkgconfig/{glib,gobject,gio,gmodule,gthread}*.pc; do
            sed 's/^Version:.*/Version: 2.70.0/' "$pc" > "$shadow/$(basename "$pc")"
          done

          stub=/opt/webkit-stub
          mkdir -p "$stub/lib" "$stub/include"
          for lib in webkit2gtk-4.1 javascriptcoregtk-4.1 soup-3.0; do
            echo 'void __llm_wiki_stub(void){}' | gcc -shared -fPIC -x c - \
              -Wl,-soname,"lib$lib.so.0" -o "$stub/lib/lib$lib.so.0"
            ln -sf "lib$lib.so.0" "$stub/lib/lib$lib.so"
          done
          write_pc() {
            printf 'prefix=/opt/webkit-stub\nlibdir=${prefix}/lib\nincludedir=${prefix}/include\n\nName: %s\nDescription: stub for headless build\nVersion: %s\nLibs: -L${libdir} -l%s\nCflags: -I${includedir}\n' "$1" "$2" "$3" > "$shadow/$1.pc"
          }
          write_pc webkit2gtk-4.1 2.46.0 webkit2gtk-4.1
          write_pc javascriptcoregtk-4.1 2.46.0 javascriptcoregtk-4.1
          write_pc libsoup-3.0 3.6.0 soup-3.0

          PKG_CONFIG_PATH="$shadow" pkg-config --modversion glib-2.0 gtk+-3.0 webkit2gtk-4.1 javascriptcoregtk-4.1 libsoup-3.0

      - name: Install Node.js 20
        run: |
          set -euxo pipefail
          dnf module install -y nodejs:20/common
          node --version
          npm --version

      - name: Install Rust toolchain
        run: |
          set -euxo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          "$HOME/.cargo/bin/cargo" --version

      - uses: actions/checkout@v4

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Build headless binary
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features headless

      # With rustc's default --as-needed linking, libraries whose symbols are
      # never referenced (GTK/WebKit on the MockRuntime path) should be absent
      # from DT_NEEDED. The webkit/jsc/soup stubs do not exist on real EL9
      # servers, so any surviving reference to them is a hard failure; glib/
      # gtk linkage would only mean the server needs those (installable)
      # packages, so that is a warning.
      - name: Inspect runtime linkage
        run: |
          set -euxo pipefail
          ldd src-tauri/target/release/llm-wiki
          if ldd src-tauri/target/release/llm-wiki | grep -Ei 'webkit2gtk-4\.1|javascriptcoregtk-4\.1|libsoup-3'; then
            echo "::error::binary references stubbed WebKit libraries; it cannot run on EL9"
            exit 1
          fi
          if ldd src-tauri/target/release/llm-wiki | grep -Ei 'gtk-3|glib-2|gdk|cairo|pango'; then
            echo "::warning::binary retains GTK runtime linkage; servers need gtk3 installed"
          else
            echo "OK: no GTK/WebKit runtime linkage"
          fi

      - name: Smoke test serve mode
        run: |
          set -euxo pipefail
          ./src-tauri/target/release/llm-wiki serve --no-open &
          app_pid=$!
          ok=""
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:19828/api/v1/ui-info; then ok=1; break; fi
            sleep 1
          done
          kill "$app_pid" || true
          test -n "$ok"

      - name: Package binary + frontend
        run: |
          mkdir -p package/llm-wiki-linux-x86_64/frontend
          cp src-tauri/target/release/llm-wiki package/llm-wiki-linux-x86_64/
          cp -r dist/. package/llm-wiki-linux-x86_64/frontend/
          tar -czf llm-wiki-linux-x86_64.tar.gz -C package llm-wiki-linux-x86_64
          ls -lh llm-wiki-linux-x86_64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llm-wiki-linux-x86_64
          path: llm-wiki-linux-x86_64.tar.gz
          retention-days: 30

      - name: Publish rolling prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: headless-latest
          name: Headless Linux build (Rocky/RHEL 9)
          prerelease: true
          files: llm-wiki-linux-x86_64.tar.gz
